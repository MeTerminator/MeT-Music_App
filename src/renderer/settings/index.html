<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>桌面歌词设置</title>
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app" class="settings-container">
        <!-- Title Bar -->
        <header class="title-bar">
            <span class="title">桌面歌词设置</span>
            <div class="close-btn" @click="closeSettings" title="关闭">×</div>
        </header>

        <!-- Main Form -->
        <main class="settings-content">

            <!-- Fonts -->
            <section class="settings-section">
                <h3>字体</h3>
                <div class="setting-item">
                    <label>歌词字体</label>
                    <select class="select-input" v-model="config.lyricFontFamily" @change="updateConfig">
                        <option value="">系统默认</option>
                        <optgroup label="内置与系统推荐">
                            <option v-for="font in featuredFonts" :key="font.value" :value="font.value">
                                {{ font.label }}
                            </option>
                        </optgroup>
                        <optgroup label="系统已安装字体" v-if="systemFonts.length">
                            <option v-for="font in systemFonts" :key="font" :value="font">{{ font }}</option>
                        </optgroup>
                    </select>
                    <label>歌词字重：{{ config.lyricFontWeight }}</label>
                    <div class="range-wrapper flex-row-gap">
                        <input type="range" v-model.number="config.lyricFontWeight"
                               min="100" max="900" step="10" @input="updateConfig">
                        <input type="number" class="num-input" v-model.number="config.lyricFontWeight"
                               min="100" max="900" step="10" @change="updateConfig">
                    </div>
                </div>
                <div class="setting-item">
                    <label>翻译字体</label>
                    <select class="select-input" v-model="config.translationFontFamily" @change="updateConfig">
                        <option value="">系统默认</option>
                        <optgroup label="内置与系统推荐">
                            <option v-for="font in featuredFonts" :key="font.value" :value="font.value">
                                {{ font.label }}
                            </option>
                        </optgroup>
                        <optgroup label="系统已安装字体" v-if="systemFonts.length">
                            <option v-for="font in systemFonts" :key="font" :value="font">{{ font }}</option>
                        </optgroup>
                    </select>
                    <label>翻译字重：{{ config.translationFontWeight }}</label>
                    <div class="range-wrapper flex-row-gap">
                        <input type="range" v-model.number="config.translationFontWeight"
                               min="100" max="900" step="10" @input="updateConfig">
                        <input type="number" class="num-input" v-model.number="config.translationFontWeight"
                               min="100" max="900" step="10" @change="updateConfig">
                    </div>
                </div>
                <p class="font-status" v-if="fontLoadError">{{ fontLoadError }}</p>
                <p class="font-license-note">
                    本应用内置使用 HarmonyOS Sans（© Huawei Device Co., Ltd.），许可协议随字体文件一并分发。
                </p>
            </section>

            <!-- Window Size -->
            <section class="settings-section">
                <h3>窗口尺寸</h3>
                <div class="setting-item">
                    <label>歌词窗口宽度：{{ windowWidth }} px</label>
                    <div class="range-wrapper flex-row-gap">
                        <input type="range" v-model.number="windowWidth" min="100"
                               :max="Math.max(100, screenSize.width)" @input="updateWindowSize">
                        <input type="number" class="num-input" v-model.number="windowWidth"
                               min="100" :max="Math.max(100, screenSize.width)" @change="updateWindowSize">
                    </div>
                </div>
                <div class="setting-item">
                    <label>歌词窗口高度：{{ windowHeight }} px</label>
                    <div class="range-wrapper flex-row-gap">
                        <input type="range" v-model.number="windowHeight" min="50"
                               :max="Math.max(50, screenSize.height)" @input="updateWindowSize">
                        <input type="number" class="num-input" v-model.number="windowHeight"
                               min="50" :max="Math.max(50, screenSize.height)" @change="updateWindowSize">
                    </div>
                </div>
            </section>

            <!-- Colors -->
            <section class="settings-section">
                <h3>歌词颜色</h3>
                <div class="setting-item flex-row">
                    <label>常规字体颜色</label>
                    <input type="color" v-model="config.textColor" @change="updateConfig">
                </div>
                <div class="setting-item">
                    <label>常规字体不透明度 ({{ config.textOpacity }}%)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="config.textOpacity" min="0" max="100" @input="updateConfig">
                    </div>
                </div>
                <div class="setting-item flex-row">
                    <label>填充颜色使用歌曲主题色</label>
                    <label class="switch">
                        <input type="checkbox" v-model="config.useThemeColorForActive" @change="updateConfig">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item flex-row" v-if="!config.useThemeColorForActive">
                    <label>KTV 填充颜色</label>
                    <input type="color" v-model="config.colorActive" @change="updateConfig">
                </div>
                <div class="setting-item flex-row">
                    <label>KTV 底色颜色</label>
                    <input type="color" v-model="inactiveColorHex" @change="updateInactiveColor">
                </div>
                <div class="setting-item">
                    <label>KTV 底色不透明度 ({{ inactiveOpacity }}%)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="inactiveOpacity" min="0" max="100" @input="updateInactiveColor">
                    </div>
                </div>
            </section>

            <!-- Text Stroke -->
            <section class="settings-section">
                <h3>文字描边</h3>
                <div class="setting-item">
                    <label>描边粗细 ({{ config.strokeWidth }}px)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="config.strokeWidth" min="0" max="8" @input="updateConfig">
                    </div>
                </div>
                <div class="setting-item flex-row">
                    <label>描边颜色</label>
                    <input type="color" v-model="config.strokeColor" @change="updateConfig">
                </div>
            </section>

            <!-- Window Styles -->
            <section class="settings-section">
                <h3>背景与特效</h3>
                <div class="setting-item flex-row">
                    <label>悬停背景色</label>
                    <input type="color" v-model="bgColorHex" @change="updateBgColor">
                </div>
                <div class="setting-item">
                    <label>悬停模糊度 ({{ config.bgBlur }}px)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="config.bgBlur" min="0" max="30" @input="updateConfig">
                    </div>
                </div>
                <div class="setting-item">
                    <label>总体不透明度 ({{ config.overallOpacity }}%)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="config.overallOpacity" min="10" max="100" @input="updateConfig">
                    </div>
                </div>
                <div class="setting-item">
                    <label>暂停时不透明度 ({{ config.pausedOpacity }}%)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="config.pausedOpacity" min="0" max="100" @input="updateConfig">
                    </div>
                </div>
            </section>

            <!-- Position & Offset Control Module -->
            <section class="settings-section">
                <h3>位置与位移控制</h3>
                
                <!-- Visual Interactive Drag Pad -->
                <div class="setting-item drag-pad-container">
                    <div class="pad-header">
                        <label>位移拖动面板 (拖拽圆点调位置)</label>
                        <span class="screen-info">屏幕: {{ screenSize.width }} × {{ screenSize.height }}</span>
                    </div>
                    <div class="drag-pad-wrapper" ref="padRef" @mousedown="onPadMouseDown">
                        <div class="drag-pad-screen">
                            <div class="drag-pad-handle" :style="padHandleStyle">
                                <span class="handle-pulse"></span>
                                <span class="handle-label">歌词</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step / Directional Controller -->
                <div class="setting-item flex-col">
                    <div class="step-header">
                        <label>方向微调位移</label>
                        <div class="step-selector">
                            <button v-for="step in [1, 10, 50]" :key="step" 
                                    class="step-btn" :class="{ active: moveStep === step }"
                                    @click="moveStep = step">
                                {{ step }}px
                            </button>
                        </div>
                    </div>
                    <div class="dpad-grid">
                        <div></div>
                        <button class="dpad-btn" @click="moveOffset(0, -moveStep)" title="向上移动">▲</button>
                        <div></div>
                        <button class="dpad-btn" @click="moveOffset(-moveStep, 0)" title="向左移动">◄</button>
                        <button class="dpad-btn dpad-center" @click="alignPosition('center')" title="屏幕中央">●</button>
                        <button class="dpad-btn" @click="moveOffset(moveStep, 0)" title="向右移动">►</button>
                        <div></div>
                        <button class="dpad-btn" @click="moveOffset(0, moveStep)" title="向下移动">▼</button>
                        <div></div>
                    </div>
                </div>

                <!-- Numeric Position Inputs & Sliders -->
                <div class="setting-item">
                    <div class="coord-label-row">
                        <label>X 轴位置 (水平): {{ windowX }} px</label>
                    </div>
                    <div class="range-wrapper flex-row-gap">
                        <input type="range" v-model.number="windowX" :min="0" :max="Math.max(1, screenSize.width - windowWidth)" @input="onCoordInputChange">
                        <input type="number" class="num-input" v-model.number="windowX" @change="onCoordInputChange">
                    </div>
                </div>

                <div class="setting-item">
                    <div class="coord-label-row">
                        <label>Y 轴位置 (垂直): {{ windowY }} px</label>
                    </div>
                    <div class="range-wrapper flex-row-gap">
                        <input type="range" v-model.number="windowY" :min="0" :max="Math.max(1, screenSize.height - windowHeight)" @input="onCoordInputChange">
                        <input type="number" class="num-input" v-model.number="windowY" @change="onCoordInputChange">
                    </div>
                </div>

                <!-- Preset Quick Buttons -->
                <div class="setting-item flex-col">
                    <label>快捷位置预设</label>
                    <div class="preset-btn-row">
                        <button class="btn btn-preset" @click="alignPosition('top-center')">顶部居中</button>
                        <button class="btn btn-preset" @click="alignPosition('bottom-center')">底部居中</button>
                        <button class="btn btn-preset" @click="alignPosition('center')">屏幕中央</button>
                        <button class="btn btn-preset" @click="alignPosition('left')">靠左</button>
                        <button class="btn btn-preset" @click="alignPosition('right')">靠右</button>
                    </div>
                </div>
            </section>

            <!-- Switches -->
            <section class="settings-section">
                <h3>其他选项</h3>
                <div class="setting-item flex-row">
                    <label>显示歌词翻译</label>
                    <label class="switch">
                        <input type="checkbox" v-model="config.showTranslation" @change="updateConfig">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item" v-if="config.showTranslation">
                    <label>翻译字体大小比例 ({{ config.transFontSizeScale }}%)</label>
                    <div class="range-wrapper">
                        <input type="range" v-model.number="config.transFontSizeScale" min="15" max="50" @input="updateConfig">
                    </div>
                </div>
                <div class="setting-item flex-row">
                    <label>锁定桌面歌词</label>
                    <label class="switch">
                        <input type="checkbox" v-model="config.isLock" @change="updateConfig">
                        <span class="slider"></span>
                    </label>
                </div>
            </section>

            <!-- Actions -->
            <div class="action-row">
                <button class="btn btn-secondary" @click="resetLyricPosition">重置位置</button>
                <button class="btn btn-secondary" @click="resetConfig">恢复默认</button>
            </div>
        </main>
    </div>

    <!-- Vue 3 -->
    <script src="../lib/vue.global.prod.js"></script>
    <!-- App Script -->
    <script src="index.js"></script>
</body>

</html>
